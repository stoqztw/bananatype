<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bananatype</title>
    <link rel="stylesheet" href="./src/scss/style.scss" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="./public/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./public/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./public/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./public/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Bananatype" />
    <link rel="manifest" href="./public/favicon/site.webmanifest" />
  </head>
  <body>
    <section class="main-screen">
      <header class="header">
        <a href="#" class="header__logo">
          <img src="./public/favicon/favicon-96x96.png" alt="Bananatype logo" />
          <p>Banana<span>type</span></p>
        </a>

        <div class="header__buttons-container">
          <button class="header__btn" data-regenerate>
            <i class="icon-keyboard"></i>
          </button>
          <button class="header__btn" data-stats>
            <i class="icon-info"></i>
          </button>
          <button class="header__btn" data-settings>
            <i class="icon-cog"></i>
          </button>
        </div>
      </header>
      <div class="main-screen__top-bar"></div>
      <div class="main-screen__container">
        <button class="main-screen__btn" data-langselect>English</button>
        <div class="main-screen__text-container">
          <!-- <div class="main-screen__pause">
						<p>
							<i class="icon-cursor"></i>Click here or press any key to focus
						</p>
					</div> -->
          <p data-text class="main-screen__text">
            This is your text example from API
          </p>
        </div>
      </div>
      <div class="main-screen__bottom-bar"></div>
    </section>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
